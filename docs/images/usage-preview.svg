<text x="64" y="46" font-size="19" fill="#438260" font-weight="600" letter-spacing="1.5">WINDOWS CODEX × WECHAT CLAWBOT</text>
<text x="64" y="111" font-size="52" fill="#172b20" font-weight="700" >Codex 微信桥接</text>
<text x="64" y="158" font-size="27" fill="#587061" font-weight="400" >审批、问答、任务进展和续聊，都能在微信处理</text>
